name: Update activity
on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest public activity
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p data
          repos=$(gh api "users/$OWNER/events/public" --jq '[.[] | select(.type=="PushEvent") | .repo.name] | reduce .[] as $x ([]; if contains([$x]) then . else . + [$x] end) | .[:3] | .[]')
          out='[]'
          for r in $repos; do
            item=$(gh api "repos/$r/commits?per_page=1" --jq '.[0] | {msg: (.commit.message | split("\n")[0]), date: .commit.author.date}' | jq --arg r "$r" '. + {repo: ($r | split("/")[1]), url: ("https://github.com/" + $r)}')
            out=$(echo "$out" | jq --argjson i "$item" '. + [$i]')
          done
          echo "$out" > data/activity.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activity.json
          git diff --cached --quiet || (git commit -m "Update activity" && git push)
